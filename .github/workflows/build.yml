name: Build yay module

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      ndk_version:
        description: "Android NDK version"
        required: true
        default: "26.3.11579264"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK + NDK ${{ inputs.ndk_version }}
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;${{ inputs.ndk_version }}"

      - name: Bun Setup
        uses: oven-sh/setup-bun@v2

      - name: Point build.sh at the installed NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ inputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Build (${{ inputs.build_type }})
        run: |
          chmod +x build.sh
          ./build.sh "${{ inputs.build_type }}"

      - name: Verify binaries
        run: |
          file bin/yay_apply bin/yay_watch bin/yay_inspect
          # Sanity: all three must be ARM64, all must exist and be non-empty.
          for bin in bin/yay_apply bin/yay_watch bin/yay_inspect; do
            [ -s "$bin" ] || { echo "::error::$bin is missing or empty"; exit 1; }
            file "$bin" | grep -q "ARM aarch64" || { echo "::error::$bin is not ARM64"; exit 1; }
          done

      - name: Verify systemui_media_fix.so (ELF hardening)
        run: |
          SO="zygisk/arm64-v8a.so"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found: $READELF"; exit 1; }
          [ -f "$SO" ] || { echo "::error::Missing library: $SO"; exit 1; }

          HEADER="$("$READELF" -hW "$SO")"
          PROGRAM="$("$READELF" -lW "$SO")"
          DYNAMIC="$("$READELF" -dW "$SO")"
          DYNSYMS="$("$READELF" --dyn-syms -W "$SO")"

          printf '%s\n' "$HEADER" | grep -q 'Class:[[:space:]]*ELF64' || { echo "::error::Expected ELF64"; exit 1; }
          printf '%s\n' "$HEADER" | grep -q 'Machine:[[:space:]]*AArch64' || { echo "::error::Expected AArch64"; exit 1; }
          printf '%s\n' "$DYNSYMS" | grep -Eq '[[:space:]]GLOBAL[[:space:]]+DEFAULT[[:space:]]+[0-9]+[[:space:]]+zygisk_module_entry$' \
            || { echo "::error::Missing exported zygisk_module_entry in .dynsym"; exit 1; }
          printf '%s\n' "$PROGRAM" | grep -q 'GNU_RELRO' || { echo "::error::GNU_RELRO is missing"; exit 1; }
          printf '%s\n' "$DYNAMIC" | grep -Eq 'BIND_NOW|FLAGS_1.*NOW' || { echo "::error::Immediate binding is missing"; exit 1; }
          if printf '%s\n' "$PROGRAM" | grep -Eq 'GNU_STACK.*RWE'; then echo "::error::Executable stack detected"; exit 1; fi
          if printf '%s\n' "$DYNAMIC" | grep -q 'TEXTREL'; then echo "::error::TEXTREL detected"; exit 1; fi
          if printf '%s\n' "$DYNAMIC" | grep -Eq 'RPATH|RUNPATH'; then echo "::error::Unexpected RPATH/RUNPATH detected"; exit 1; fi
          if printf '%s\n' "$DYNAMIC" | grep -q 'libc++_shared.so'; then echo "::error::Unexpected shared libc++ dependency"; exit 1; fi

          echo "arm64-v8a: ELF verification passed"

      - name: Build WebUI
        working-directory: src/yay-webui
        run: |
          bun install
          bun run build
          mkdir -p ../../webroot
          cp -r ./dist/* ../../webroot/

      - name: Read module version
        id: ver
        run: |
          version=$(grep -m1 '^version=' module.prop | cut -d= -f2)
          versionCode=$(grep -m1 '^versionCode=' module.prop | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$versionCode" >> "$GITHUB_OUTPUT"

      - name: Stage flashable module
        run: |
          stage=staging/yay
          mkdir -p "$stage"

          # Only what customize.sh / Magisk's installer actually needs at
          # flash time — source, build config, and dev tooling are
          # intentionally left out (see README's "Module structure" section).
          cp -r bin "$stage/"
          cp -r config "$stage/"
          cp -r META-INF "$stage/"
          cp -r webroot "$stage/"
          cp module.prop "$stage/"
          cp customize.sh "$stage/"
          cp post-fs-data.sh "$stage/"
          cp service.sh "$stage/"
          cp skip_mount "$stage/"
          if [ -f zygisk/arm64-v8a.so ]; then
            mkdir -p "$stage/zygisk"
            cp zygisk/arm64-v8a.so "$stage/zygisk/"
          fi

          chmod 755 "$stage"/bin/yay_apply "$stage"/bin/yay_watch "$stage"/bin/yay_inspect
          chmod 755 "$stage"/customize.sh "$stage"/post-fs-data.sh "$stage"/service.sh
          [ -f "$stage/zygisk/arm64-v8a.so" ] && chmod 644 "$stage/zygisk/arm64-v8a.so"
          true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 zips the directory automatically — uploading
          # a pre-made .zip would produce a .zip inside a .zip on download.
          # The artifact name becomes the downloaded filename + .zip.
          name: yay-${{ steps.ver.outputs.version }}-${{ inputs.build_type }}
          path: staging/yay/
          retention-days: 30
          if-no-files-found: error
