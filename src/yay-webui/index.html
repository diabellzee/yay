<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1014" />
    <meta name="description" content="yay — Android system tweaks: I/O scheduler, component disable, appops, game mode." />
    <!-- Host-provided theme/inset variables. A <link> loads in parallel with
         the app CSS; the same URLs as a CSS @import would be fetched only
         after main.css arrived and was parsed. Tokens carry fallbacks, so
         cascade order does not matter. -->
    <link rel="stylesheet" href="https://mui.kernelsu.org/internal/insets.css" />
    <link rel="stylesheet" href="https://mui.kernelsu.org/internal/colors.css" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>yay</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
